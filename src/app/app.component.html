<div>
    <p *ngIf="errorMessage">{{errorMessage}}</p>
    <h2>Add Two Numbers</h2>
    <form (ngSubmit)="calculateSum()">
      <label for="number1">Number 1:</label>
      <input
        type="number"
        [(ngModel)]="number1"
        name="number1"
        required
      />
      <br />
      <label for="number2">Number 2:</label>
      <input
        type="number"
        [(ngModel)]="number2"
        name="number2"
        required
      />
      <br />
      <button type="submit">Add</button>
    </form>
    <h3 *ngIf="sum !== null">Result: {{ sum }}</h3>
  </div>

  <div>
    <h3>Calculation History</h3>
    <table *ngIf="calculations.length" border="1">
      <tr>
        <th>Number 1</th>
        <th>Number 2</th>
        <th>Result</th>
        <th>Timestamp</th>
        <th>Actions</th>
      </tr>
      <tr *ngFor="let calc of calculations">
        <td>{{ calc.number1 }}</td>
        <td>{{ calc.number2 }}</td>
        <td>{{ calc.result }}</td>
        <td>{{ calc.timestamp | date: 'short' }}</td>
        <td>
          <button (click)="deleteCalculation(calc.id!)">Delete</button>
        </td>
      </tr>
    </table>
  </div>
